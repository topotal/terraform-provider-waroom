name: tagpr

# tagpr keeps a release pull request up to date. Merging it makes tagpr tag the merge commit
# and create a draft release, and the release job then builds, signs and publishes it.
# The release runs in this workflow, taking the tag from tagpr's output.
on:
  push:
    branches: [ main ]

permissions: {}

concurrency:
  group: tagpr
  cancel-in-progress: false

env:
  GOPRIVATE: github.com/topotal/waroom-client-go

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The release-tag ruleset lets only this App create v* tags. The App token also lets
      # the release PR trigger the test workflow, which GITHUB_TOKEN events cannot.
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.WAROOM_ECOSYSTEM_APP_CLIENT_ID }}
          private-key: ${{ secrets.WAROOM_ECOSYSTEM_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
      - id: tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    # The GPG signing key lives in this environment's secrets, which only main can use.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          # GoReleaser needs the previous tags.
          fetch-depth: 0
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.WAROOM_ECOSYSTEM_APP_CLIENT_ID }}
          private-key: ${{ secrets.WAROOM_ECOSYSTEM_APP_PRIVATE_KEY }}
          owner: topotal
          repositories: waroom-client-go
          permission-contents: read
      - name: Allow go to fetch waroom-client-go
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/topotal/waroom-client-go".insteadOf "https://github.com/topotal/waroom-client-go"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      # Until the GPG key is registered, release without signing. The Terraform Registry
      # does not ingest unsigned releases, so register it before publishing there.
      # TODO: When the repository becomes public, make signing required: register the key,
      # remove this step and the import-gpg condition, and pass `release --clean` directly.
      - id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "goreleaser-args=release --clean" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GPG_PRIVATE_KEY is not set; releasing without a signature"
            echo "goreleaser-args=release --clean --skip=sign" >> "$GITHUB_OUTPUT"
          fi
          echo "enabled=$([ -n "$GPG_PRIVATE_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: import-gpg
        if: steps.gpg.outputs.enabled == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ steps.gpg.outputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}
      # SHA256SUMS lists every zip and the manifest, so it covers all release assets.
      # Its name has the version without the v prefix.
      - id: checksums
        env:
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: echo "path=dist/terraform-provider-waroom_${TAG#v}_SHA256SUMS" >> "$GITHUB_OUTPUT"
      # Artifact attestations need a public repository on the Team plan.
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}
