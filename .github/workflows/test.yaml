name: Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

  unit-test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          cache: true
      - name: Run unit tests
        run: go test -timeout=300s -parallel=10 -cover -v ./...