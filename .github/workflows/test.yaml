name: Test

on:
  workflow_dispatch:
    inputs:
      run_acceptance_tests:
        description: 'Run acceptance tests'
        required: false
        type: boolean
        default: false
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

  unit-test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout terraform-provider-waroom
        uses: actions/checkout@v6
        with:
          path: terraform-provider-waroom
      - name: Checkout waroom-client-go
        uses: actions/checkout@v6
        with:
          repository: topotal/waroom-client-go
          path: waroom-client-go
          ssh-key: ${{ secrets.WAROOM_CLIENT_GO_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: terraform-provider-waroom/go.mod
          cache: true
          cache-dependency-path: |
            terraform-provider-waroom/go.sum
            waroom-client-go/go.sum
      - name: Create go.work
        working-directory: terraform-provider-waroom
        run: |
          go work init .
          go work edit -replace github.com/topotal/waroom-client-go=../waroom-client-go
          cat go.work
      - name: Run unit tests
        working-directory: terraform-provider-waroom
        run: go test -timeout=300s -parallel=10 -cover -v ./...

  acceptance-test:
    runs-on: ubuntu-latest
    needs: setup
    if: github.event.inputs.run_acceptance_tests == 'true'
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_wrapper: false
      - name: Checkout terraform-provider-waroom
        uses: actions/checkout@v6
        with:
          path: terraform-provider-waroom
      - name: Checkout waroom-client-go
        uses: actions/checkout@v6
        with:
          repository: topotal/waroom-client-go
          path: waroom-client-go
          ssh-key: ${{ secrets.WAROOM_CLIENT_GO_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: terraform-provider-waroom/go.mod
          cache: true
          cache-dependency-path: |
            terraform-provider-waroom/go.sum
            waroom-client-go/go.sum
      - name: Setup Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Create go.work
        working-directory: terraform-provider-waroom
        run: |
          go work init .
          go work edit -replace github.com/topotal/waroom-client-go=../waroom-client-go
          cat go.work
      - name: Run acceptance tests
        working-directory: terraform-provider-waroom
        env:
          E2E_WAROOM_API_KEY: ${{ secrets.E2E_WAROOM_API_KEY }}
          E2E_WAROOM_API_ENDPOINT: ${{ secrets.E2E_WAROOM_API_ENDPOINT }}
        run: task test:acc
