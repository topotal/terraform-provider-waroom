name: Test

# The test jobs run PR code with no App secrets.

on:
  workflow_dispatch:
    inputs:
      run_acceptance_tests:
        description: 'Run acceptance tests'
        required: false
        type: boolean
        default: false
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      # Compiling the dependencies (mostly the generated waroom-client-go) dominates
      # the first build step. The build cache is content-addressed, so a stale entry
      # is never used. Only pushes to main save it, so PR code cannot poison it.
      - id: go-cache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.dir }}
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-
      - run: go vet ./...
      - name: Run unit tests
        run: go test -timeout=300s -parallel=10 -cover -v ./...
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.dir }}
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}

  acceptance-test:
    runs-on: ubuntu-latest
    if: github.event.inputs.run_acceptance_tests == 'true'
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          checksum: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb # task_linux_amd64.tar.gz
      - name: Run acceptance tests
        env:
          E2E_WAROOM_API_KEY: ${{ secrets.E2E_WAROOM_API_KEY }}
          E2E_WAROOM_API_ENDPOINT: ${{ secrets.E2E_WAROOM_API_ENDPOINT }}
        run: task test:acc
