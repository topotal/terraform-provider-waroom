name: Test

on:
  workflow_dispatch:
    inputs:
      run_acceptance_tests:
        description: 'Run acceptance tests'
        required: false
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

env:
  GOPRIVATE: github.com/topotal/waroom-client-go

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.WAROOM_ECOSYSTEM_APP_CLIENT_ID }}
          private-key: ${{ secrets.WAROOM_ECOSYSTEM_APP_PRIVATE_KEY }}
          owner: topotal
          repositories: waroom-client-go
          permission-contents: read
      - name: Allow go to fetch waroom-client-go
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/topotal/waroom-client-go".insteadOf "https://github.com/topotal/waroom-client-go"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: go test -timeout=300s -parallel=10 -cover -v ./...

  acceptance-test:
    runs-on: ubuntu-latest
    if: github.event.inputs.run_acceptance_tests == 'true'
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.WAROOM_ECOSYSTEM_APP_CLIENT_ID }}
          private-key: ${{ secrets.WAROOM_ECOSYSTEM_APP_PRIVATE_KEY }}
          owner: topotal
          repositories: waroom-client-go
          permission-contents: read
      - name: Allow go to fetch waroom-client-go
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/topotal/waroom-client-go".insteadOf "https://github.com/topotal/waroom-client-go"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          checksum: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb # task_linux_amd64.tar.gz
      - name: Run acceptance tests
        env:
          E2E_WAROOM_API_KEY: ${{ secrets.E2E_WAROOM_API_KEY }}
          E2E_WAROOM_API_ENDPOINT: ${{ secrets.E2E_WAROOM_API_ENDPOINT }}
        run: task test:acc
