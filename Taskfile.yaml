# Taskfile.yml
version: '3'

vars:
  PKG: provider
  CLIENT_PKG: github.com/topotal/waroom-client-go/waroom
  CLIENT_TYPE: Client

env:
  # Use only this checkout's go.work. Worktrees under .claude/worktrees/ would otherwise pick up
  # the parent checkout's go.work and fail with "main module does not contain package".
  GOWORK:
    sh: test -f "{{.ROOT_DIR}}/go.work" && echo "{{.ROOT_DIR}}/go.work" || echo off

tasks:
  gen:
    desc: "Generate resource/data_source. Usage: task gen name=service_label [kind=resource]"
    vars:
      name: { sh: 'echo ${name:-}' }
      kind: { sh: 'echo ${kind:-resource}' } # resource | data_source
    preconditions:
      - sh: 'test -n "{{.name}}"'
        msg: 'name is required (snake_case). e.g. task gen name=service_label'
    cmds:
      - >
        go run ./cmd/tfgen
        -out internal/{{.PKG}}
        -kind {{.kind}}
        -name {{.name}}
        -pkg {{.PKG}}
        -client-pkg {{.CLIENT_PKG}}
        -client-type {{.CLIENT_TYPE}}
      # - 'command -v goimports >/dev/null 2>&1 && goimports -w ./{{.PKG}} || gofmt -w ./{{.PKG}}'

  gen:r:
    desc: "Generate resource (shortcut): task gen:r name=service_label"
    cmds:
      - task: gen
        vars: { name: '{{.name}}', kind: 'resource' }

  gen:d:
    desc: "Generate data_source (shortcut): task gen:d name=service_label"
    cmds:
      - task: gen
        vars: { name: '{{.name}}', kind: 'data_source' }

  gen-docs:
    desc: "Generate documentation for resources and data sources"
    cmds:
      - cd tools; go generate ./...

  build:
    desc: "Build the project"
    cmds:
      - go build -v ./...

  install:
    desc: "Install the project"
    cmds:
      - go install -v ./...

  playground:
    desc: "Install the provider and set up temp/playground to try it with terraform plan/apply"
    deps: [install]
    vars:
      DIR: "{{.ROOT_DIR}}/temp/playground"
      BIN_DIR:
        sh: 'd=$(go env GOBIN); [ -n "$d" ] || d="$(go env GOPATH | cut -d: -f1)/bin"; echo "$d"'
    cmds:
      - mkdir -p "{{.DIR}}"
      # Regenerated every time so that it follows GOBIN / GOPATH.
      - |
        cat > "{{.DIR}}/dev.tfrc" <<EOF
        provider_installation {
          dev_overrides {
            "registry.terraform.io/topotal/waroom" = "{{.BIN_DIR}}"
          }
          direct {}
        }
        EOF
      # Created only once; edit them freely.
      - |
        test -f "{{.DIR}}/.envrc" || cat > "{{.DIR}}/.envrc" <<'EOF'
        # Generated by `task playground`. Not overwritten; edit freely.
        source_up_if_exists
        export TF_CLI_CONFIG_FILE="$PWD/dev.tfrc"
        export WAROOM_API_ENDPOINT="http://localhost:3001"
        # Use LOCAL_WAROOM_API_KEY for the local Waroom if it is set (e.g. in the repository's .envrc; same name as waroomctl's local context).
        export WAROOM_API_KEY="${LOCAL_WAROOM_API_KEY:-$WAROOM_API_KEY}"
        EOF
      - |
        test -f "{{.DIR}}/main.tf" || cat > "{{.DIR}}/main.tf" <<'EOF'
        terraform {
          required_providers {
            waroom = {
              source = "topotal/waroom"
            }
          }
        }

        # endpoint and api_key are read from WAROOM_API_ENDPOINT and WAROOM_API_KEY (see .envrc).
        provider "waroom" {}
        EOF
      - |
        echo "Playground: {{.DIR}}"
        echo "  cd {{.DIR}} && direnv allow   # or export the variables in .envrc yourself"
        echo "  terraform plan                # no terraform init needed with dev_overrides"

  test:
    desc: "Run unit tests"
    cmds:
      - go test -timeout=300s -parallel=10 {{.CLI_ARGS}} ./...

  test:acc:
    silent: true # Avoid leaking API_KEY to stdout
    desc: "Run acceptance tests"
    preconditions:
      - sh: '[ -n "$E2E_WAROOM_API_KEY" ] && [ -n "$E2E_WAROOM_API_ENDPOINT" ]'
        msg: 'E2E_WAROOM_API_KEY and E2E_WAROOM_API_ENDPOINT environment variables are required for acceptance tests'
    cmds:
      # NOTE: In E2E testing, always override WAROOM_API_KEY and WAROOM_API_ENDPOINT with the E2E_ environment variable.
      - WAROOM_API_KEY={{.E2E_WAROOM_API_KEY}} WAROOM_API_ENDPOINT={{.E2E_WAROOM_API_ENDPOINT}} TF_ACC=1 go test -timeout=120m {{.CLI_ARGS}} ./...

  test:acc:op:
    desc: "Run acceptance tests with the E2E_ variables from .env.e2e, resolved by the 1Password CLI (see .env.e2e.example)"
    vars:
      # .env.e2e is gitignored, so worktrees read it from the main checkout.
      ENV_FILE: { sh: 'echo "${ENV_E2E_FILE:-$(git rev-parse --path-format=absolute --git-common-dir)/../.env.e2e}"' }
    preconditions:
      - sh: 'command -v op >/dev/null'
        msg: '1Password CLI (op) is required'
      - sh: 'test -f "{{.ENV_FILE}}"'
        msg: '{{.ENV_FILE}} not found. Copy .env.e2e.example to .env.e2e and fill it in.'
    cmds:
      - op run --env-file "{{.ENV_FILE}}" -- task test:acc -- {{.CLI_ARGS}}

  fmt:
    desc: "Format code"
    cmds:
      - gofmt -s -w -e .

  lint:
    desc: "Lint code"
    cmds:
      - golangci-lint run

